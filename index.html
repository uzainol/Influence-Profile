benar penting bagi saya."],"exchange":["Saya menawarkan sesuatu sebagai balasan apabila meminta bantuan.","Saya mengingatkan orang lain tentang bantuan yang pernah saya berikan.","Saya mencadangkan persetujuan yang memberi manfaat kepada kedua-dua pihak."],"pressure":["Saya membuat peringatan berulang kali sehingga tugas diselesaikan.","Saya menetapkan tarikh akhir yang tegas dan membuat susulan.","Saya menjelaskan akibatnya jika sesuatu tugas tidak dilaksanakan."],"legitimating":["Saya merujuk kepada peraturan atau bidang kuasa saya.","Saya merujuk kepada amalan yang telah digunakan sebelum ini.","Saya menyatakan bahawa permintaan tersebut telah mendapat kelulusan pihak pengurusan."],"coalition":["Saya mendapatkan bantuan orang lain untuk meyakinkan seseorang.","Saya mendapatkan sokongan beberapa orang sebelum membuat permintaan.","Saya memaklumkan siapa lagi yang telah bersetuju dengan cadangan saya."]},"desc":{"rational":"Anda menggunakan alasan yang logik, fakta dan bukti untuk menunjukkan bahawa sesuatu permintaan itu munasabah dan boleh dilaksanakan.","consultation":"Anda mendapatkan pandangan orang lain dan melibatkan mereka dalam penyediaan rancangan sebelum meminta sokongan.","collaboration":"Anda menawarkan bantuan, sumber atau sokongan untuk memudahkan orang lain memenuhi permintaan anda.","inspirational":"Anda mengaitkan permintaan dengan nilai, aspirasi dan tujuan yang bermakna supaya orang lain bersemangat untuk bertindak.","apprising":"Anda menerangkan bagaimana sesuatu tugas dapat membantu orang lain mencapai matlamat, mengembangkan kemahiran atau memajukan kerjaya mereka.","ingratiation":"Anda menunjukkan penghargaan yang tulus dan mengiktiraf kekuatan orang lain untuk membina hubungan baik sebelum atau semasa membuat permintaan.","personal":"Anda meminta sokongan berdasarkan hubungan peribadi dan kepercayaan yang telah terjalin.","exchange":"Anda menawarkan balasan, seperti bantuan atau pertolongan pada masa hadapan, sebagai sebahagian daripada persetujuan bersama.","pressure":"Anda menggunakan tarikh akhir, peringatan dan tindakan susulan yang tegas untuk memastikan sesuatu tugas disiapkan.","legitimating":"Anda merujuk kepada peraturan, dasar, jawatan atau amalan terdahulu untuk menunjukkan bahawa permintaan anda mempunyai asas yang sah.","coalition":"Anda mendapatkan sokongan daripada orang lain atau menunjukkan bahawa ramai yang sudah bersetuju bagi mengukuhkan cadangan anda."},"strength":{"rational":["Anda cenderung menggunakan alasan yang boleh disemak dan dinilai oleh orang lain. Ini membantu mereka memahami sebab di sebalik sesuatu keputusan, khususnya apabila perkara tersebut rumit atau berisiko. Anda tidak perlu mempunyai jawapan bagi setiap persoalan untuk menggunakan pendekatan ini dengan baik.","Walaupun hujah anda kukuh, orang lain mungkin masih berasa pandangan mereka tidak didengari. Selain mengemukakan bukti, berikan ruang untuk mereka menyuarakan kebimbangan, keutamaan dan cabaran yang dihadapi.","Apabila membuat permintaan seterusnya, kemukakan satu bukti yang kukuh dan kaitkannya dengan matlamat orang tersebut. Kemudian tanya: “Apa lagi yang perlu anda tahu sebelum dapat bersetuju dengan cadangan ini?”","Bilakah bukti tambahan diperlukan, dan bilakah mendengar pandangan orang lain lebih membantu?"],"consultation":["Anda selesa memberi ruang kepada orang lain untuk menyumbang idea. Melibatkan mereka dapat meningkatkan rasa tanggungjawab terhadap keputusan bersama dan membantu anda melihat perkara yang mungkin terlepas pandang. Ini juga menunjukkan bahawa anda menghargai pengalaman mereka.","Rundingan akan lebih berkesan jika anda benar-benar terbuka kepada pandangan orang lain. Pada masa yang sama, jelaskan perkara yang sudah diputuskan, perkara yang masih boleh diubah dan bila keputusan perlu dibuat.","Bentangkan cadangan seterusnya sebagai draf. Nyatakan satu bahagian yang masih boleh diubah, minta pandangan dan tunjukkan bagaimana maklum balas itu diambil kira.","Siapakah yang patut saya libatkan lebih awal untuk mendapatkan hasil yang lebih baik?"],"collaboration":["Anda cenderung menawarkan bantuan atau sumber apabila meminta orang lain melakukan sesuatu. Kesediaan berkongsi tanggungjawab ini boleh membuatkan mereka berasa disokong dan tidak perlu menghadapi cabaran sendirian.","Bantuan paling bermakna ialah bantuan yang mampu anda tunaikan. Elakkan berjanji melebihi kemampuan atau mengambil alih tanggungjawab orang lain tanpa disedari.","Sebelum membuat permintaan seterusnya, tanya: “Apa yang mungkin menyukarkan tugas ini?” Tawarkan satu bentuk bantuan yang khusus dan realistik, kemudian persetujui pembahagian tanggungjawab.","Adakah bantuan saya membolehkan orang lain lebih berdikari, atau menjadikan mereka terlalu bergantung pada saya?"],"inspirational":["Anda pandai menghubungkan sesuatu tugas dengan tujuan yang lebih bermakna. Pendekatan ini boleh meningkatkan semangat dan komitmen, terutama apabila kerja tersebut mencabar atau memerlukan usaha berterusan.","Setiap orang mempunyai sumber motivasi yang berbeza. Perkara yang penting bagi anda belum tentu sama pentingnya bagi mereka. Seimbangkan mesej yang memberi inspirasi dengan langkah yang jelas dan dengar apa yang mendorong mereka.","Dalam perbincangan pasukan seterusnya, jelaskan siapa yang akan mendapat manfaat daripada hasil kerja tersebut. Kemudian ajak ahli pasukan berkongsi sebab matlamat itu penting bagi mereka.","Adakah saya mengetengahkan tujuan saya sendiri, tujuan mereka atau tujuan yang benar-benar dikongsi bersama?"],"apprising":["Anda peka terhadap cara sesuatu permintaan boleh membantu orang lain mencapai cita-cita mereka. Apabila mereka nampak manfaat yang benar-benar relevan, kerjasama boleh menjadi pilihan yang bermakna kepada mereka, bukan sekadar memenuhi permintaan anda.","Jangan menganggap anda sudah tahu apa yang penting bagi seseorang. Manfaat yang dijanjikan hanya meyakinkan jika ia benar, khusus dan selaras dengan keperluannya.","Tanya seorang rakan sekerja perkara yang ingin dipelajari atau dicapainya. Jika tugasan anda benar-benar dapat membantunya, jelaskan kaitan tersebut.","Adakah saya sudah bertanya apa yang penting baginya, atau sekadar membuat andaian?"],"ingratiation":["Pilihan anda menunjukkan bahawa penghargaan dan hubungan baik merupakan sebahagian daripada cara anda mempengaruhi orang lain. Apabila pujian diberikan secara khusus dan ikhlas, orang akan lebih mudah berasa dihargai dan dihormati. Ini dapat mengukuhkan kepercayaan dari semasa ke semasa.","Penghargaan akan lebih dipercayai jika tidak diberikan semata-mata untuk mendapatkan persetujuan. Amalkan penghargaan dalam urusan harian, termasuk ketika anda tidak memerlukan bantuan.","Minggu ini, ucapkan terima kasih kepada seseorang atas sumbangan khusus yang telah diberikan, tanpa meminta apa-apa sebagai balasan. Perhatikan kesannya terhadap hubungan anda.","Adakah penghargaan saya masih ikhlas jika saya tidak memerlukan bantuannya?"],"personal":["Anda selesa meminta sokongan melalui hubungan yang dibina atas dasar kepercayaan. Kesediaan meminta pertolongan dan menjaga hubungan yang saling membantu merupakan kekuatan dalam kehidupan profesional.","Hubungan rapat perlu dijaga dengan teliti. Berikan orang lain kebebasan untuk menolak tanpa rasa bersalah. Elakkan meminta mereka mengabaikan keperluan atau tanggungjawab sendiri hanya kerana hubungan yang rapat.","Apabila meminta bantuan daripada seseorang yang rapat dengan anda, jelaskan mengapa sokongannya bermakna. Nyatakan juga bahawa dia boleh menolak jika tidak dapat membantu.","Adakah orang ini berasa selesa untuk memberikan jawapan yang jujur kepada saya?"],"exchange":["Anda selesa membincangkan manfaat bersama secara terbuka. Persetujuan yang jelas dan adil sangat berguna apabila bekerjasama dengan rakan setara yang tidak mempunyai kuasa rasmi antara satu sama lain.","Persetujuan yang baik dibuat secara sukarela oleh kedua-dua pihak. Pastikan tawaran anda benar-benar bermanfaat dan komitmen yang dipersetujui mampu ditunaikan.","Apabila meminta bantuan daripada rakan setara, jelaskan perkara yang boleh anda tawarkan sebagai balasan. Tanya apa yang berguna baginya dan bincangkan jangkaan kedua-dua pihak.","Adakah persetujuan ini benar-benar adil dan berbaloi dari sudut pandangannya?"],"pressure":["Anda sanggup menetapkan tarikh akhir yang jelas, memberi peringatan dan membuat susulan apabila perlu. Jika digunakan dengan bijak, pendekatan ini dapat memastikan komitmen penting dipenuhi, terutama apabila masa terhad.","Desakan juga boleh menimbulkan tekanan jika orang lain tidak memahami sebabnya atau tidak diberi peluang menyuarakan kesulitan. Sebelum meningkatkan desakan, cuba fahami halangan yang mereka hadapi dan bantuan yang boleh diberikan.","Untuk tugasan yang mempunyai tarikh akhir penting, jelaskan mengapa tarikh itu perlu dipatuhi. Tanya tentang cabaran yang mungkin timbul dan persetujui masa untuk membuat susulan.","Adakah saya membantu orang lain bertanggungjawab, atau membuat mereka tertekan sehingga enggan bersuara?"],"legitimating":["Anda cenderung merujuk kepada peranan, dasar dan prosedur apabila membuat permintaan. Ini dapat mewujudkan kejelasan dan rasa adil, terutama apabila keputusan perlu konsisten serta dapat dipertanggungjawabkan.","Orang lebih mudah menerima peraturan apabila memahami tujuannya. Jelaskan perkara yang masih boleh dibincangkan dan perkara yang memang wajib dipatuhi. Walaupun tiada ruang untuk mengubah peraturan, mereka masih boleh memberi pandangan tentang pelaksanaannya.","Apabila merujuk kepada sesuatu dasar, terangkan tujuan dasar itu dan tanya: “Bagaimana kita boleh melaksanakannya dengan adil?”","Adakah saya membantu orang lain memahami keputusan tersebut, atau sekadar menegaskan kuasa saya?"],"coalition":["Anda memahami bahawa sokongan daripada beberapa pihak boleh meningkatkan keyakinan dan membantu menggerakkan perubahan. Kerjasama seperti ini amat berguna apabila sesuatu cadangan melibatkan pelbagai pasukan atau pihak berkepentingan.","Namun, seseorang mungkin keberatan menyuarakan pandangan berbeza jika berasa dirinya tidak mendapat sokongan. Jelaskan sokongan yang telah diperoleh tanpa memberi gambaran bahawa perbincangan sudah ditutup.","Apabila membentangkan cadangan yang disokong oleh beberapa pihak, terangkan siapa yang telah terlibat dan jemput orang lain mengemukakan soalan, kebimbangan atau cadangan alternatif.","Adakah orang yang tidak bersetuju masih berasa pandangannya didengari dan dihormati?"]},"focus":{"rational":["Dalam audit ini, anda kurang kerap memilih hujah berasaskan fakta berbanding pendekatan lain. Ini menunjukkan kecenderungan anda, bukan tahap kebolehan anda. Anda mungkin sudah mahir membina semangat atau hubungan; bukti yang ringkas boleh menjadikan pendekatan tersebut lebih meyakinkan.","Pilih satu permintaan yang akan dibuat tidak lama lagi. Sediakan satu fakta atau contoh yang boleh dipercayai, terangkan kepentingannya dan kaitkan dengan matlamat orang yang anda ingin yakinkan.","Apakah maklumat yang diperlukan oleh orang ini sebelum dia yakin untuk menyokong cadangan saya?"],"consultation":["Anda mungkin biasa menyediakan rancangan sendiri atau membuat keputusan dengan cepat. Ini boleh membantu, terutama apabila masa terhad. Namun, cuba libatkan orang lain lebih awal, ketika pandangan mereka masih boleh mempengaruhi hasil keputusan.","Kongsikan rancangan seterusnya dalam bentuk draf dan tanya: “Ada apa-apa yang saya terlepas pandang?” Gunakan satu cadangan yang praktikal, atau terangkan dengan baik mengapa cadangan tersebut tidak dapat dilaksanakan.","Bahagian manakah dalam keputusan saya yang benar-benar boleh dipengaruhi oleh pandangan orang lain?"],"collaboration":["Anda mungkin jelas tentang perkara yang perlu dilakukan, tetapi tidak selalu menawarkan bantuan secara langsung apabila membuat permintaan. Ini tidak bermakna anda tidak menyokong orang lain. Mungkin terdapat halangan yang mereka hadapi tetapi belum anda sedari.","Apabila membuat permintaan seterusnya, tanya: “Apa yang mungkin menyukarkan tugas ini?” Kemudian tawarkan satu bentuk bantuan yang realistik, seperti sumber, masa, pengenalan kepada orang yang sesuai atau penyesuaian cara kerja.","Apakah perkara yang saya anggap mudah, sedangkan mungkin sukar bagi mereka?"],"inspirational":["Anda mungkin lebih cenderung menjelaskan fakta, tugas atau tarikh akhir berbanding sebab sesuatu kerja itu penting. Pendekatan tersebut tetap berguna. Dengan mengaitkan tugas kepada tujuan yang lebih bermakna, anda boleh membantu orang lain mengekalkan motivasi.","Sebelum meminta bantuan pasukan, sediakan satu ayat ringkas tentang siapa yang akan mendapat manfaat dan mengapa hasil kerja itu penting. Kongsikannya, kemudian tanya apa yang menjadikan matlamat tersebut bermakna bagi mereka.","Apakah tujuan yang lebih bermakna di sebalik tugas yang saya minta orang lain lakukan?"],"apprising":["Anda mungkin lebih menumpukan keperluan pasukan atau organisasi tanpa menjelaskan manfaat kepada individu yang diminta membantu. Ini perkara biasa apabila kerja banyak. Pendekatan ini bukan tentang menjanjikan ganjaran, tetapi tentang memahami matlamat sebenar orang lain.","Sebelum membuat permintaan, tanya apa yang ingin dipelajari atau dicapai oleh orang tersebut. Jika tugas itu boleh membantunya, jelaskan kaitannya. Jika tidak, berterus terang.","Adakah saya hanya menjelaskan keperluan saya, atau sudah memahami perkara yang penting baginya?"],"ingratiation":["Dalam audit ini, anda kurang kerap memilih pendekatan yang menunjukkan penghargaan. Anda mungkin lebih selesa membiarkan hasil kerja menunjukkan nilainya, dan itu juga boleh dilihat sebagai sikap profesional. Namun, penghargaan yang dinyatakan secara jelas dapat membantu orang lain berasa dihargai.","Minggu ini, ucapkan terima kasih kepada seorang rakan sekerja atas sumbangan yang khusus, tanpa meminta apa-apa sebagai balasan. Terangkan apa yang dilakukannya dan bagaimana perkara itu membantu.","Siapakah yang banyak membantu saya kebelakangan ini tetapi belum menerima penghargaan sewajarnya?"],"personal":["Anda mungkin lebih suka mengekalkan hubungan kerja yang formal atau menyelesaikan tugas sendiri tanpa meminta pertolongan. Sikap berdikari ada kelebihannya. Namun, meminta bantuan daripada orang yang dipercayai juga membuka ruang untuk saling menyokong.","Pilih seorang rakan sekerja yang mempunyai hubungan baik dengan anda. Terangkan mengapa sesuatu perkara itu penting dan minta satu bentuk bantuan yang jelas. Berikan ruang untuknya menolak.","Adakah saya sedang memikul tanggungjawab sendirian walaupun ada rakan sekerja yang sudi membantu?"],"exchange":["Anda mungkin kurang selesa menganggap permintaan sebagai urusan timbal balas kerana tidak mahu hubungan terasa seperti transaksi. Itu satu pertimbangan yang baik. Namun, antara rakan setara, menawarkan bantuan sebagai balasan boleh menjadikan permintaan lebih adil.","Apabila meminta bantuan rakan sekerja, tanya: “Ada apa-apa yang boleh saya bantu sebagai balasan?” Jika bersetuju, bincangkan perkara yang akan dilakukan dan tunaikan janji tersebut.","Adakah saya meminta lebih banyak daripada orang lain berbanding apa yang sanggup saya sumbangkan?"],"pressure":["Anda kurang cenderung menggunakan tarikh akhir yang tegas atau membuat susulan berulang kali. Ini mungkin mencerminkan gaya yang menghormati ruang orang lain. Apabila tugas benar-benar penting, tarikh akhir yang jelas dan susulan yang berhemah boleh membantu tanpa menjejaskan kepercayaan.","Pilih satu komitmen penting. Persetujui tarikh siap bersama orang yang terlibat, jelaskan sebabnya dan tetapkan masa untuk membuat susulan.","Adakah sesuatu tugas kerap tertangguh kerana saya belum menetapkan masa siap yang jelas?"],"legitimating":["Anda mungkin lebih suka menggunakan hujah atau hubungan baik daripada merujuk kepada kuasa dan peraturan rasmi. Pendekatan itu boleh menjadikan komunikasi lebih mesra. Namun, apabila orang lain tidak pasti tentang sesuatu permintaan, rujukan kepada dasar atau prosedur yang dipersetujui dapat memberi kepastian.","Apabila seseorang teragak-agak untuk memenuhi permintaan, jelaskan dasar, persetujuan atau tanggungjawab rasmi yang menjadi asasnya. Terangkan juga mengapa perkara itu penting.","Bilakah penjelasan tentang peraturan dapat membantu orang lain lebih yakin untuk bersetuju?"],"coalition":["Anda mungkin biasa mengemukakan cadangan sendiri tanpa mendapatkan sokongan lebih awal. Ini boleh menjimatkan masa. Namun, bagi perubahan besar atau projek merentas pasukan, mendapatkan pandangan dan sokongan rakan sekerja yang dihormati dapat mengukuhkan cadangan anda.","Sebelum membentangkan cadangan penting, bincangkan idea itu dengan seorang atau dua orang rakan sekerja yang dipercayai. Minta pandangan mereka dan tanya sama ada mereka sudi menyokongnya.","Sokongan awal daripada siapakah yang dapat membantu cadangan saya lebih mudah diterima?"]},"what":{"rational":"Menggunakan penjelasan yang logik, fakta dan bukti yang jelas supaya orang lain memahami mengapa sesuatu permintaan itu munasabah.","consultation":"Melibatkan orang lain dalam penyediaan rancangan dan mendapatkan cadangan sebelum membuat keputusan akhir.","collaboration":"Menawarkan bantuan, masa atau sumber sendiri untuk memudahkan orang lain melaksanakan permintaan anda.","inspirational":"Mengaitkan permintaan dengan nilai, aspirasi dan matlamat yang lebih bermakna.","apprising":"Menjelaskan bagaimana sesuatu tugas dapat memberi manfaat kepada orang lain, termasuk dari segi kemahiran, matlamat atau kerjaya.","ingratiation":"Menunjukkan penghargaan secara ikhlas dan mengiktiraf sumbangan orang lain untuk membina hubungan kerja yang baik.","personal":"Meminta bantuan berdasarkan kepercayaan dan hubungan baik yang telah terjalin.","exchange":"Menawarkan bantuan atau sesuatu yang bernilai sebagai balasan supaya kedua-dua pihak mendapat manfaat.","pressure":"Menggunakan tarikh akhir, peringatan dan tindakan susulan supaya komitmen penting dapat ditunaikan.","legitimating":"Merujuk kepada dasar, peraturan, tanggungjawab rasmi atau amalan terdahulu bagi menjelaskan asas sesuatu permintaan.","coalition":"Mendapatkan sokongan orang lain untuk mengukuhkan cadangan dan meningkatkan keyakinan terhadapnya."}};

const MAX_SCORE = 4;      // head-to-heads per tactic
const BALANCE = 2;        // MAX_SCORE / 2
function bandFor(score) {
  if (score <= 1) return { key: "UNDERUSED", label: tx("UNDERUSED", "JARANG DIPILIH") };
  if (score <= 2) return { key: "SITUATIONAL", label: tx("SITUATIONAL", "MENGIKUT KEADAAN") };
  return { key: "SIGNATURE", label: tx("SIGNATURE", "KECENDERUNGAN UTAMA") };
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function buildSession() {
  const occ = {};
  const pairs = PAIRS_IDX.map(function (p) {
    const i = p[0], j = p[1], ti = TByIndex[i], tj = TByIndex[j];
    const si = (occ[i] = (occ[i] || 0) + 1) - 1;
    const sj = (occ[j] = (occ[j] || 0) + 1) - 1;
    const A = { tacticId: ti.id, text: ti.items[si % 3], icon: ICONS[ti.id][si % 3] };
    const B = { tacticId: tj.id, text: tj.items[sj % 3], icon: ICONS[tj.id][sj % 3] };
    const flip = Math.random() < 0.5;
    return { key: ti.id + "__" + tj.id, left: flip ? B : A, right: flip ? A : B };
  });
  return shuffle(pairs);
}
function computeConsistency(answers) {
  const win = {};
  Object.keys(answers).forEach(function (k) { win[k] = answers[k]; });
  const idOf = function (i) { return TByIndex[i].id; };
  const pairKey = {};

function pickStyle(scored) {

  let top = scored.filter(function (s) { return s.score === max; });
  if (top.length === 1) {

    if (rest.length) { const second = Math.max.apply(null, rest); top = top.concat(scored.filter(function (s) { return s.score === second; })); }

            {tx("These tactics are tools, not tricks. Use them only where your claim is true and the interest is genuinely shared — the aim is commitment freely given. Reserve Hard tactics for when they are legitimately warranted. This is a relative profile; best read alongside candid peer feedback.", "Taktik ini ialah cara untuk mendapatkan kerjasama, bukan helah memperdaya orang lain. Gunakannya secara jujur, dengan mengambil kira kepentingan semua pihak. Matlamatnya ialah komitmen yang diberikan secara sukarela. Gunakan pendekatan Keras hanya apabila benar-benar wajar. Baca profil ini bersama maklum balas yang jujur daripada rakan sekerja.")}
          </p>
        </div>
      </div>

      {/* ----- actions (not captured) ----- */}
      <div style={{ padding: "6px 28px 72px" }}>
        <button onClick={downloadPDF} style={Object.assign({}, btnPrimary, { marginTop: 22 })} onMouseDown={function (e) { e.preventDefault(); }}>{pdfLabel}</button>
        <button onClick={copyResults} style={Object.assign({}, btnGhost, { marginTop: 12 })} onMouseDown={function (e) { e.preventDefault(); }}>{copied ? tx("✓ COPIED TO CLIPBOARD", "✓ BERJAYA DISALIN") : tx("⧉ COPY MY RESULTS", "⧉ SALIN KEPUTUSAN SAYA")}</button>
        {!props.facilitator && <button onClick={props.onRestart} style={Object.assign({}, btnGhost, { marginTop: 12 })} onMouseDown={function (e) { e.preventDefault(); }}>{tx("↻ RETAKE THE AUDIT", "↻ JAWAB PENILAIAN SEKALI LAGI")}</button>}
      </div>
    </div>
  );
}

/* ---------- spiderweb ---------- */
const FAMILY_FILL = { CORE: "#E2F1E5", SOFT: "#F4EDDD", HARD: "#E6EAF0" };
const FAMILY_NAME = LANG === "ms" ? { CORE: "Teras", SOFT: "Lembut", HARD: "Keras" } : { CORE: "Core", SOFT: "Soft", HARD: "Hard" };
const SHORT_MS = { rational: "Fakta", consultation: "Rundingan", collaboration: "Kerjasama", inspirational: "Semangat",
  apprising: "Manfaat", ingratiation: "Hubungan Baik", personal: "Peribadi", exchange: "Timbal Balas",
  pressure: "Desakan", legitimating: "Autoriti", coalition: "Sokongan" };
const SHORT = LANG === "ms" ? SHORT_MS : { rational: "Rational", consultation: "Consultation", collaboration: "Collaboration", inspirational: "Inspirational",
  apprising: "Apprising", ingratiation: "Ingratiation", personal: "Personal", exchange: "Exchange",
  pressure: "Pressure", legitimating: "Legitimating", coalition: "Coalition" };

function Radar(props) {
  const L = props.scored, n = L.length;
  const W = 640, H = 400, cx = 320, cy = 200, R = 150, R0 = 18;
  const ang = function (i) { return -Math.PI / 2 + (2 * Math.PI * i) / n; };
  const rad = function (v) { return R0 + ((R - R0) * v) / MAX_SCORE; };
  const pt = function (i, v) { return [cx + Math.cos(ang(i)) * rad(v), cy + Math.sin(ang(i)) * rad(v)]; };
  const ring = function (v) { return L.map(function (_, i) { return pt(i, v).join(","); }).join(" "); };
  const mid = function (i) { const a = pt(((i % n) + n) % n, MAX_SCORE), b = pt((((i + 1) % n) + n) % n, MAX_SCORE); return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; };
  const wedges = ["CORE", "SOFT", "HARD"].map(function (g) {
    const idx = L.map(function (s, i) { return s.group === g ? i : -1; }).filter(function (i) { return i >= 0; });
    const first = idx[0], last = idx[idx.length - 1];
    const pts = [[cx, cy], mid(first - 1)].concat(idx.map(function (i) { return pt(i, MAX_SCORE); }), [mid(last)]);
    return <polygon key={g} points={pts.map(function (p) { return p.join(","); }).join(" ")} fill={FAMILY_FILL[g]} />;
  });
  return (
    <svg viewBox={"0 0 " + W + " " + H} width="100%" style={{ display: "block", margin: "18px auto 0", maxWidth: 640 }} role="img"
      aria-label={tx("Influence web: ", "Carta gaya mempengaruhi: ") + L.map(function (s) { return s.name + " " + s.score; }).join(", ")}>
      {wedges}
      {[0, 1, 3, 4].map(function (v) { return <polygon key={v} points={ring(v)} fill="none" stroke="#FFFFFF" strokeWidth="1.5" />; })}
      {L.map(function (_, i) { const a = pt(i, 0), b = pt(i, MAX_SCORE); return <line key={i} x1={a[0]} y1={a[1]} x2={b[0]} y2={b[1]} stroke="#FFFFFF" strokeWidth="1.5" />; })}
      <polygon points={ring(BALANCE)} fill="none" stroke={C.green} strokeWidth="1.8" strokeDasharray="5 4" />
      {[1, 2, 3, 4].map(function (v) { return <text key={v} x={cx + 6} y={cy - rad(v) + 13} fontSize="10" fill={C.grey} fontFamily={BODY}>{v}</text>; })}
      <polygon points={L.map(function (s, i) { return pt(i, s.score).join(","); }).join(" ")} fill="#1A1A1A" fillOpacity="0.07" stroke={C.ink} strokeWidth="2.2" strokeLinejoin="round" />
      {L.map(function (s, i) { const p = pt(i, s.score), f = props.isFocus(s.id);
        return <circle key={s.id} cx={p[0]} cy={p[1]} r={f ? 6.5 : 4.5} fill={f ? C.green : C.ink} stroke="#FFFFFF" strokeWidth="2" />; })}
      {L.map(function (s, i) {
        const a = ang(i), c = Math.cos(a), sn = Math.sin(a), f = props.isFocus(s.id);
        const x = cx + c * (R + 16), y = cy + sn * (R + 16);
        const anchor = Math.abs(c) < 0.25 ? "middle" : (c > 0 ? "start" : "end");
        const dy = sn < -0.9 ? -8 : (sn > 0.85 ? 14 : 4);
        return (
          <g key={s.id}>
            <text x={x} y={y + dy} textAnchor={anchor} fontSize="15" fontWeight="700" fontFamily={HEAD} letterSpacing="0.3" fill={f ? C.green : C.ink}>{SHORT[s.id].toUpperCase()}</text>
            <text x={x} y={y + dy + 16} textAnchor={anchor} fontSize="12.5" fontFamily={BODY} fill={f ? C.green : C.grey}>{s.score + "/" + MAX_SCORE + (f ? tx(" · FOCUS", " · FOKUS") : "")}</text>
          </g>
        );
      })}
    </svg>
  );
}

function RadarLegend() {
  const item = function (fill, label) {
    return (
      <span key={label} style={{ display: "inline-flex", alignItems: "center", gap: 6, marginRight: 16 }}>
        <span style={{ width: 12, height: 12, background: fill, border: "1px solid " + C.hairline, display: "inline-block" }} />{label}
      </span>
    );
  };
  return (
    <div style={{ fontFamily: BODY, fontSize: 12, color: C.muted, textAlign: "center", marginTop: 6, lineHeight: 2 }}>
      {item(FAMILY_FILL.CORE, FAMILY_NAME.CORE)}{item(FAMILY_FILL.SOFT, FAMILY_NAME.SOFT)}{item(FAMILY_FILL.HARD, FAMILY_NAME.HARD)}
      <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
        <span style={{ width: 18, height: 0, borderTop: "2px dashed " + C.green, display: "inline-block" }} />{tx("Balance point (2)", "Titik tengah (2)")}
      </span>
    </div>
  );
}

function ScoreList(props) {
  return (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(190px, 1fr))", gap: 20, marginTop: 22 }}>
      {["CORE", "SOFT", "HARD"].map(function (g) {
        return (
          <div key={g}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, paddingBottom: 6, borderBottom: "2px solid " + C.ink }}>
              <span style={{ width: 12, height: 12, background: FAMILY_FILL[g], border: "1px solid " + C.hairline }} />
              <span style={{ fontFamily: HEAD, fontWeight: 700, fontSize: 12, letterSpacing: "0.2em", color: C.ink }}>{FAMILY_NAME[g].toUpperCase()}</span>
            </div>
            {props.scored.filter(function (s) { return s.group === g; }).map(function (s) {
              const f = props.isFocus(s.id);
              const bandColor = s.band.key === "SIGNATURE" ? C.green : (s.band.key === "SITUATIONAL" ? C.ink : C.grey);
              return (
                <div key={s.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8, padding: "7px 0", borderBottom: "1px solid " + C.hairline }}>
                  <span style={{ fontFamily: HEAD, fontWeight: 700, fontSize: 13, color: f ? C.green : C.ink }}>{s.name}</span>
                  <span style={{ fontFamily: BODY, fontSize: 12, color: f ? C.green : bandColor, whiteSpace: "nowrap" }}><b>{s.score}</b> · {f ? tx("Focus", "Fokus") : s.band.label.charAt(0) + s.band.label.slice(1).toLowerCase()}</span>
                </div>
              );
            })}
          </div>
        );
      })}
    </div>
  );
}

function CoachLine(props) {
  return (
    <p style={{ fontFamily: BODY, fontSize: 14.5, color: C.ink, lineHeight: 1.55, margin: "10px 0 0", fontStyle: props.italic ? "italic" : "normal" }}>
      <b style={{ fontStyle: "normal", color: C.ink }}>{props.label}.</b> {props.text}
    </p>
  );
}

function ProfileBar(props) {
  const tactic = props.tactic, highlight = props.highlight;
  const pct = (tactic.score / MAX_SCORE) * 100;
  const bandColor = tactic.band.key === "SIGNATURE" ? C.green : tactic.band.key === "SITUATIONAL" ? C.ink : C.grey;
  return (
    <div style={{ marginBottom: 12 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 5 }}>
        <span style={{ fontFamily: HEAD, fontWeight: 700, fontSize: 13.5, letterSpacing: "0.04em", color: C.ink }}>
          {tactic.name}{highlight && <span style={{ color: C.green, marginLeft: 8, fontSize: 11, letterSpacing: "0.12em" }}>{tx("◄ FOCUS", "◄ FOKUS")}</span>}
        </span>
        <span style={{ fontFamily: HEAD, fontWeight: 700, fontSize: 12, letterSpacing: "0.1em", color: bandColor }}>{tactic.score} · {tactic.band.label}</span>
      </div>
      <div style={{ height: 12, background: C.tint, border: "1px solid " + C.hairline, position: "relative" }}>
        <div style={{ position: "absolute", left: "50%", top: -2, bottom: -2, width: 2, background: C.green, opacity: 0.5 }} />
        <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: pct + "%", minWidth: tactic.score > 0 ? 3 : 0, background: highlight ? C.green : (bandColor === C.grey ? C.grey : C.ink), transition: "width .4s ease" }} />
      </div>
    </div>
  );
}
function ListRow(props) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", padding: "9px 0", borderBottom: "1px solid " + C.hairline }}>
      <span style={{ fontFamily: HEAD, fontWeight: 700, fontSize: 13, color: C.ink, letterSpacing: "0.02em", lineHeight: 1.1 }}>{props.name}</span>
      <span style={{ fontFamily: HEAD, fontWeight: 700, fontSize: 15, color: C.green, marginLeft: 10, flexShrink: 0 }}>{props.score}</span>
    </div>
  );
}
const btnPrimary = { marginTop: 34, width: "100%", padding: "16px 24px", fontFamily: HEAD, fontWeight: 700, fontSize: 15, letterSpacing: "0.14em", color: C.white, background: C.ink, border: "none", cursor: "pointer" };
const btnGo = { background: C.green, color: C.white, fontSize: 16, padding: "18px 24px" };
const btnGhost = { width: "100%", padding: "15px 24px", fontFamily: HEAD, fontWeight: 700, fontSize: 14, letterSpacing: "0.14em", color: C.ink, background: C.white, border: "1px solid " + C.ink, cursor: "pointer" };

/* A facilitator link from admin.html carries a saved result in the URL fragment,
   which never leaves the browser: #report=<base64 JSON {n,s,t,a}>[&dl=1] */
function readReportLink() {
  try {
    const h = window.location.hash || "";
    const m = h.match(/report=([^&]+)/);
    if (!m) return null;
    const d = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
    if (!d || typeof d.a !== "object") return null;
    return { name: String(d.n || ""), session: String(d.s || ""), takenAt: String(d.t || ""), answers: d.a, download: /(^|&|#)dl=1/.test(h) };
  } catch (e) { return null; }
}
const REPORT_LINK = readReportLink();

function App() {
  if (REPORT_LINK) {
    return (
      <div style={{ minHeight: "100vh", background: C.white, color: C.ink, fontFamily: BODY }}>
        {!REPORT_LINK.download && <LangToggle />}
        <Results answers={REPORT_LINK.answers} name={REPORT_LINK.name} facilitator={true}
          sessionName={REPORT_LINK.session} takenAt={REPORT_LINK.takenAt} autoDownload={REPORT_LINK.download} />
      </div>
    );
  }
  const [screen, setScreen] = useState("landing");
  const [email, setEmail] = useState("");
  useEffect(function () { window.scrollTo(0, 0); }, [screen]);
  const [answers, setAnswers] = useState({});
  const [page, setPage] = useState(0);
  const [name, setName] = useState("");
  const [session, setSession] = useState(buildSession);
  return (
    <div style={{ minHeight: "100vh", background: C.white, color: C.ink, fontFamily: BODY }}>
      {(screen === "landing" || screen === "intro") && <LangToggle />}
      {screen === "landing" && <Landing onBegin={function () { setScreen("intro"); }} />}
      {screen === "intro" && <Intro name={name} setName={setName} email={email} setEmail={setEmail} onBack={function () { setScreen("landing"); }} onBegin={function () { setPage(0); setAnswers({}); setSession(buildSession()); setScreen("audit"); }} />}
      {screen === "audit" && <Audit session={session} answers={answers} setAnswers={setAnswers} page={page} setPage={setPage} onFinish={function () { setScreen("results"); }} />}
      {screen === "results" && <Results answers={answers} name={name} email={email} onRestart={function () { setAnswers({}); setPage(0); setName(""); setEmail(""); setSession(buildSession()); setScreen("intro"); }} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
